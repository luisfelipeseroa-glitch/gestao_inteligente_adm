    icones();
    $$('[data-edit]', el).forEach(b => b.onclick = () => form(lista.find(c => c.id===b.dataset.edit)));
    $$('[data-tog]', el).forEach(b => b.onclick = async () => { const c = lista.find(x => x.id===b.dataset.tog); try { await dbq(sb.from('comunicados').update({ ativo: !c.ativo }).eq('id', c.id)); carregar(); } catch { erro('Erro ao alterar status'); } });
    $$('[data-del]', el).forEach(b => b.onclick = async () => { if (!confirm('Excluir este comunicado?')) return; try { await dbq(sb.from('comunicados').delete().eq('id', b.dataset.del)); ok('Comunicado excluído'); carregar(); } catch { erro('Erro ao excluir'); } });
  };
  const form = c => modal({ titulo: c ? 'Editar Comunicado' : 'Novo Comunicado',
    corpo: `<div class="campo"><label class="lb">Título *</label><input class="inp" id="c-tit" value="${esc(c?.titulo||'')}" placeholder="Título do comunicado"></div>
      <div class="campo"><label class="lb">Conteúdo *</label><textarea class="inp" rows="5" id="c-cont" placeholder="Digite o conteúdo...">${esc(c?.conteudo||'')}</textarea></div>
      <div class="campo"><label class="lb">Prioridade</label><select class="inp" id="c-pri">${opts(PRIORIDADES, c?.prioridade||'normal')}</select></div>
      <label class="check"><input type="checkbox" id="c-at" ${c?.ativo===false?'':'checked'}> Ativo (visível no portal do colaborador)</label>
      ${c?'':'<p class="xs muted mt">Comunicados <b>urgentes</b> ou <b>importantes</b> geram uma notificação para todos os colaboradores ativos.</p>'}`,
    rodape: `<button class="btn outline" data-fechar>Cancelar</button><button class="btn" id="c-ok">${ic('megaphone')} Publicar</button>`,
    aoAbrir: m => m.$('#c-ok').onclick = async () => {
      const reg = { titulo:m.$('#c-tit').value.trim(), conteudo:m.$('#c-cont').value.trim(), prioridade:m.$('#c-pri').value, ativo:m.$('#c-at').checked, autor:nomeUsuario() };
      if (!reg.titulo) return erro('Informe o título'); if (!reg.conteudo) return erro('Informe o conteúdo');
      const b = m.$('#c-ok'); b.disabled = true; b.textContent = 'Salvando...';
      try {
        if (c) { await dbq(sb.from('comunicados').update(reg).eq('id', c.id)); ok('Comunicado atualizado'); }
        else {
          await dbq(sb.from('comunicados').insert(reg));
          if (reg.prioridade !== 'normal') {
            try { const ps = await dbq(sb.from('profissionais').select('matricula').eq('ativo', true).not('matricula','is',null));
              const ns = ps.map(p => ({ matricula:p.matricula, tipo: reg.prioridade==='urgente'?'comunicado_urgente':'comunicado_importante', titulo:`Comunicado: ${reg.titulo}`, mensagem: reg.conteudo.substring(0,200), lida:false }));
              for (let i = 0; i < ns.length; i += 500) await dbq(sb.from('notificacoes').insert(ns.slice(i, i+500)));
            } catch (e) { console.error('Erro ao criar notificações', e); }
          }
          ok('Comunicado publicado');
        }
        m.fechar(); carregar();
      } catch { erro('Erro ao salvar'); b.disabled = false; b.textContent = 'Publicar'; }
    } });
  $('#novo').onclick = () => form(null);
  carregar();
}

      m.$('#f-ini').onchange = m.$('#f-fim').onchange = tot; tot();
      m.$('#f-ok').onclick = async () => {
        const pid = m.$('#f-prof').value, ini = m.$('#f-ini').value, fim = m.$('#f-fim').value;
        if (!pid) return erro('Selecione o profissional'); if (!ini || !fim) return erro('Informe as datas'); if (fim < ini) return erro('A data de fim é anterior ao início');
        const reg = { profissional_id:pid, profissional_nome: profs.find(p => p.id===pid)?.nome, tipo:m.$('#f-tipo').value, data_inicio:ini, data_fim:fim, dias:diasEntre(ini,fim), observacao:m.$('#f-obs').value.trim() };
        try { if (f) await dbq(sb.from('ferias').update(reg).eq('id', f.id)); else await dbq(sb.from('ferias').insert(reg));
          ok(f ? 'Registro atualizado' : 'Registro criado'); m.fechar(); carregar(); } catch { erro('Erro ao salvar'); }
      };
    } });
  $('#novo').onclick = () => form(null);
  carregar();
}

/* ---------------- USUÁRIOS ---------------- */
async function pageUsuarios(el) {
  const sou_admin = usuarioAtual?.papel === 'admin';
  el.innerHTML = cabecalho('Usuários do Sistema','Coordenadores e RH com acesso à área de gestão') +
    `<div class="card card-b mb"><p style="font-weight:600" class="row mb">${ic('user-plus')} Como dar acesso a um novo coordenador</p>
      <ol class="small" style="margin:0;padding-left:18px;color:#475569;line-height:1.7">
        <li>No painel do Supabase, abra <b>Authentication → Users</b>.</li>
        <li>Clique em <b>Add user → Send invitation</b> (a pessoa recebe um e-mail para criar a senha) ou <b>Create new user</b> (você define a senha).</li>
        <li>A pessoa aparece nesta lista automaticamente. ${sou_admin ? 'Aqui você pode mudar o nível de acesso.' : 'Só administradores podem mudar o nível de acesso.'}</li></ol></div>
    <div class="card"><div class="tabela-wrap" id="tab">${carregando}</div></div>`;
  icones();
  const carregar = async () => {
    const us = await dbq(sb.from('perfis').select('*').order('created_at'));
    $('#tab').innerHTML = us.length===0 ? '<p class="vazio">Nenhum usuário cadastrado</p>' : `<table class="tb"><thead><tr><th>Nome</th><th>E-mail</th><th>Nível</th></tr></thead><tbody>
      ${us.map(u => `<tr><td style="font-weight:500">${esc(u.nome||'—')}${u.id===usuarioAtual?.id?' <span class="badge c-slate">você</span>':''}</td><td>${esc(u.email)}</td>
        <td>${sou_admin && u.id !== usuarioAtual?.id ? `<select class="inp" data-papel="${u.id}" style="width:auto;height:32px"><option value="user" ${u.papel!=='admin'?'selected':''}>Usuário</option><option value="admin" ${u.papel==='admin'?'selected':''}>Administrador</option></select>`
          : `<span class="badge ${u.papel==='admin'?'c-blue':'c-slate'}">${ic(u.papel==='admin'?'shield-check':'user')} ${u.papel==='admin'?'Administrador':'Usuário'}</span>`}</td></tr>`).join('')}</tbody></table>`;
    icones();
    $$('[data-papel]', el).forEach(s => s.onchange = async () => { try { await dbq(sb.from('perfis').update({ papel: s.value }).eq('id', s.dataset.papel)); ok('Nível de acesso atualizado'); } catch { erro('Erro ao atualizar'); carregar(); } });
  };
  carregar();
}

/* =====================================================================
   ROTEADOR (hash: funciona no GitHub Pages)
   ===================================================================== */
const ROTAS = [
  ['/', pageInicio], ['/cadastro', pageCadastro], ['/portal/:matricula', pagePortal], ['/nova-solicitacao', pageNovaSolicitacao],
  ['/login', pageLogin], ['/nova-senha', pageNovaSenha],
  ['/admin', pageDashboard, true], ['/admin/profissionais', pageProfissionais, true], ['/admin/nova-solicitacao', pageNovaSolicitacao, true],
  ['/admin/minhas-solicitacoes', pageMinhasSolicitacoes, true], ['/admin/aprovacoes', pageAprovacoes, true], ['/admin/calendario', pageCalendario, true],
  ['/admin/escalas', pageEscalas, true], ['/admin/calculos', pageCalculos, true], ['/admin/indicadores', pageIndicadores, true],
  ['/admin/documentos', pageDocumentos, true], ['/admin/comunicados', pageComunicados, true], ['/admin/ferias', pageFerias, true], ['/admin/usuarios', pageUsuarios, true],
];
async function rotear() {
  const h = location.hash || '#/';
  if (/access_token=|type=recovery|error_description=/.test(h)) return;   // retorno do e-mail do Supabase: tratado em onAuthStateChange
  const [caminho, qs] = h.slice(1).split('?');
  const params = Object.fromEntries(new URLSearchParams(qs || ''));
  const app = $('#app');
  $('#modais').innerHTML = '';
  window.scrollTo(0, 0);
  for (const [padrao, pagina, admin] of ROTAS) {
    const nomes = [], rx = new RegExp('^' + padrao.replace(/:(\w+)/g, (_, n) => { nomes.push(n); return '([^/]+)'; }) + '/?$');
    const m = caminho.match(rx);
    if (!m) continue;
    nomes.forEach((n, i) => params[n] = decodeURIComponent(m[i+1]));
    try { if (admin) await layoutAdmin(app, padrao, pagina, params); else { await pagina(app, params); icones(); } }
    catch (e) { console.error(e); app.innerHTML = `<div class="centro"><div class="card card-b cx-login"><p class="caixa cx-red">Erro: ${esc(e.message||e)}</p><a class="btn mt" href="#/">Voltar</a></div></div>`; }
    return;
  }
  app.innerHTML = `<div class="centro"><div class="card card-b cx-login" style="text-align:center"><h1>404</h1><p class="muted mb">Página não encontrada</p><a class="btn" href="#/">${ic('house')} Ir para o início</a></div></div>`;
  icones();
}
function avisoInicial(titulo, texto) {
  document.getElementById('app').innerHTML = `<div class="centro"><div class="card card-b cx-login"><h1>${titulo}</h1><p class="muted mt">${texto}</p></div></div>`;
}
if (!CONFIG_OK) {
  avisoInicial('Configuração pendente', 'Abra o <b>index.html</b> e preencha <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> (Supabase → Settings → API). Depois publique no GitHub Pages.');
} else if (!sb) {
  avisoInicial('Não foi possível carregar o app', 'As bibliotecas externas (Supabase) não carregaram. Verifique a internet ou abra o app pelo endereço do GitHub Pages — a pré-visualização do chat bloqueia scripts externos.');
} else {
  sb.auth.onAuthStateChange((evento) => {
    if (evento === 'PASSWORD_RECOVERY') { location.hash = '#/nova-senha'; return; }
    if (evento === 'SIGNED_OUT') usuarioAtual = null;
    if (evento === 'SIGNED_IN' && /access_token=/.test(location.hash)) location.hash = '#/admin';
  });
  window.addEventListener('hashchange', rotear);
  rotear();
}
</script>
