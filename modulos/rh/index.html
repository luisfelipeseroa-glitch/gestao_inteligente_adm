<html lang="pt-BR" data-mod="rh">
<head>
<meta charset="utf-8"><script src="../embed.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPA Rocinha — Gestão de RH</title>
<link rel="icon" id="favicon" href="">
<link rel="apple-touch-icon" id="apple-icon" href="">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#1e3a5f; --primary-2:#2b5285; --primary-soft:#e8eef6;
  --bg:#f8fafc; --card:#fff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b; --muted-2:#94a3b8;
  --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:24px;margin:0 0 4px;font-weight:700}
h2{font-size:16px;margin:0 0 12px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:12px} .xs{font-size:11px}
.lucide{width:16px;height:16px;stroke-width:2;flex-shrink:0}
.ic-lg .lucide,.lucide.ic-lg{width:20px;height:20px}
/* layout */
.admin{display:flex;min-height:100vh}
.sidebar{width:248px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:transform .2s}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border)}
.sidebar nav{flex:1;overflow-y:auto;padding:10px}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#475569;font-weight:500;margin-bottom:2px}
.sidebar nav a:hover{background:#f1f5f9;text-decoration:none}
.sidebar nav a.ativo{background:var(--primary);color:#fff}
.sidebar .rodape{border-top:1px solid var(--border);padding:12px}
.main{flex:1;margin-left:248px;min-width:0}
.main-inner{padding:28px;max-width:1200px;margin:0 auto}
.topbar{display:none;background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.overlay{display:none}
@media (max-width:1023px){
  .sidebar{transform:translateX(-100%)} .sidebar.aberta{transform:none}
  .main{margin-left:0} .topbar{display:flex} .main-inner{padding:16px}
  .overlay.on{display:block;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:35}
}
.logo{width:40px;height:40px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.logo .lucide{width:22px;height:22px}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:1fr}}
@media (max-width:640px){.g2{grid-template-columns:1fr}}
.stack>*+*{margin-top:12px}
.mt{margin-top:16px} .mt-l{margin-top:28px} .mb{margin-bottom:16px}
/* card */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-b{padding:18px}
.card.borda-esq{border-left:4px solid var(--primary)}
.list>*{border-bottom:1px solid #f1f5f9} .list>*:last-child{border-bottom:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px}
.item:hover{background:#f8fafc}
.ico-box{width:40px;height:40px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#475569}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .num{font-size:28px;font-weight:700}
.stat .ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.vazio{padding:36px 16px;text-align:center;color:var(--muted-2)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:var(--primary);color:#fff;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--primary-2);text-decoration:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.icon{width:36px;padding:0} .btn.sm.icon{width:32px}
.btn.outline{background:#fff;border-color:var(--border);color:#334155}
.btn.outline:hover{background:#f8fafc}
.btn.ghost{background:transparent;color:#475569}
.btn.ghost:hover{background:#f1f5f9}
.btn.verde{background:#059669} .btn.verde:hover{background:#047857}
.btn.vermelho{background:#e11d48} .btn.vermelho:hover{background:#be123c}
.btn.outline.vermelho-t{color:#e11d48;border-color:#fecdd3} .btn.outline.vermelho-t:hover{background:#fff1f2}
.btn.block{width:100%}
/* forms */
label.lb{display:block;font-size:13px;font-weight:500;color:#334155;margin-bottom:5px}
.inp,select.inp,textarea.inp{width:100%;height:38px;border:1px solid var(--border);border-radius:8px;padding:0 11px;font:inherit;background:#fff;color:var(--text)}
textarea.inp{height:auto;padding:9px 11px;resize:vertical}
.inp:focus{outline:2px solid #bfd3ea;border-color:var(--primary)}
.campo{margin-bottom:12px}
.busca{position:relative} .busca .lucide{position:absolute;left:11px;top:11px;color:var(--muted-2)} .busca .inp{padding-left:34px}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.c-amber{background:#fef3c7;color:#b45309;border-color:#fde68a}
.c-blue{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
.c-green{background:#d1fae5;color:#047857;border-color:#a7f3d0}
.c-red{background:#ffe4e6;color:#be123c;border-color:#fecdd3}
.c-slate{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.c-purple{background:#ede9fe;color:#6d28d9;border-color:#ddd6fe}
.c-cyan{background:#cffafe;color:#0e7490;border-color:#a5f3fc}
.c-teal{background:#ccfbf1;color:#0f766e;border-color:#99f6e4}
.c-orange{background:#ffedd5;color:#c2410c;border-color:#fed7aa}
.c-indigo{background:#e0e7ff;color:#4338ca;border-color:#c7d2fe}
.c-pink{background:#fce7f3;color:#be185d;border-color:#fbcfe8}
.c-yellow{background:#fef9c3;color:#a16207;border-color:#fef08a}
.c-violet{background:#ede9fe;color:#6d28d9;border-color:#ddd6fe}
.tile{display:flex;align-items:center;gap:10px;padding:14px;border-radius:10px;border:1px solid;cursor:pointer;text-align:left;font:inherit;width:100%}
.tile:hover{filter:brightness(.97);text-decoration:none}
.tile p{color:inherit}
/* table */
.tabela-wrap{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{text-align:left;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:#f8fafc}
table.tb td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
table.tb tr:hover td{background:#fafcff}
.tc{text-align:center!important} .tr{text-align:right!important}
/* tabs */
.tabs{display:inline-flex;background:#f1f5f9;border-radius:10px;padding:4px;gap:2px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font:inherit;font-weight:500;color:#475569;cursor:pointer}
.tabs button.on{background:#fff;color:var(--text);box-shadow:var(--shadow)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.largo{max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-b{padding:18px 20px;max-height:calc(100vh - 220px);overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}
.det{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13px}
.det dt{color:var(--muted)} .det dd{margin:0}
.caixa{border-radius:8px;padding:10px 12px;font-size:13px}
.cx-amber{background:#fffbeb;color:#92400e} .cx-blue{background:#eff6ff;color:#1e40af} .cx-slate{background:#f8fafc;color:#334155} .cx-red{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}
/* toast */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#0f172a;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:360px;font-size:13px;display:flex;gap:8px;align-items:flex-start;animation:entra .2s}
.toast.erro{background:#be123c} .toast.ok{background:#047857}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
/* assinatura */
.assin{position:relative;border:2px dashed #cbd5e1;border-radius:10px;background:#fff;overflow:hidden}
.assin canvas{display:block;width:100%;height:180px;touch-action:none;cursor:crosshair}
.assin .dica{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted-2);pointer-events:none}
.assin .limpar{position:absolute;top:6px;right:6px}
.assin-img{background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px;max-width:260px;max-height:110px;object-fit:contain}
/* calendário */
.cal-sem{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;font-weight:600;color:var(--muted-2);margin-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dia{min-height:84px;padding:5px;border:1px solid #f1f5f9;border-radius:8px;background:#fff;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-dia:hover{border-color:#cbd5e1;background:#f8fafc}
.cal-dia.fora{opacity:.4} .cal-dia.sel{border-color:var(--primary);background:var(--primary-soft)}
.cal-dia .n{font-size:12px;font-weight:600;color:#334155}
.cal-dia.hoje .n{background:var(--primary);color:#fff;border-radius:999px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.cal-ev{font-size:10.5px;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0}
.cal.compacto .cal-dia{min-height:50px}
@media (max-width:640px){.cal-dia{min-height:54px}.cal-ev{font-size:9.5px;padding:0 3px}}
/* público */
.centro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#eef3f9,#f8fafc)}
.cx-login{width:100%;max-width:420px}
.portal-head{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.portal-wrap{max-width:900px;margin:0 auto;padding:16px}
.dot{width:8px;height:8px;border-radius:999px;background:#e11d48;display:inline-block}
.contador{background:#e11d48;color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.carregando{padding:60px 0;text-align:center;color:var(--muted-2)}
.spin{width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:var(--primary);border-radius:999px;animation:gira .8s linear infinite;margin:0 auto}
@keyframes gira{to{transform:rotate(360deg)}}
.vac{background:#fff1f2}
.so-print{display:none}
@media print{
  .sidebar,.topbar,.no-print,#toasts{display:none!important}
  .main{margin:0} .main-inner{padding:0;max-width:none} .so-print{display:block} body{background:#fff}
  .card{box-shadow:none}
}
</style>

    ${rodape?`<div class="modal-f">${rodape}</div>`:''}</div>`;
  const fechar = () => { bg.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key==='Escape') fechar(); };
  bg.addEventListener('mousedown', e => { if (e.target===bg) fechar(); });
  $$('[data-fechar]', bg).forEach(b => b.onclick = fechar);

  icones();
  const m = { el: bg, fechar, $: s => $(s, bg) };
  if (aoAbrir) aoAbrir(m);
  return m;
}

async function enviarArquivo(arquivo, pasta='geral') {
  const ext = (arquivo.name && arquivo.name.includes('.')) ? arquivo.name.split('.').pop().toLowerCase() : (arquivo.type==='image/png'?'png':'bin');
  const caminho = `${pasta}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from('arquivos').upload(caminho, arquivo, { contentType: arquivo.type || undefined });
  if (error) throw error;
  return sb.storage.from('arquivos').getPublicUrl(caminho).data.publicUrl;
}
async function enviarAssinatura(dataUrl) {
  if (!dataUrl) return '';
  const blob = await (await fetch(dataUrl)).blob();
  return enviarArquivo(new File([blob], 'assinatura.png', { type:'image/png' }), 'assinaturas');
}

function baixar(blob, nome) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* Exportação CSV / Excel / PDF */
function exportar(fmt, arquivo, titulo, cols, linhas) {
  const matriz = linhas.map(r => cols.map(c => r[c.key] ?? ''));
  if (fmt === 'csv') {
    const txt = [cols.map(c=>c.label), ...matriz].map(l => l.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    baixar(new Blob(['\ufeff'+txt], {type:'text/csv;charset=utf-8'}), arquivo+'.csv');
  } else if (fmt === 'excel') {
    const ws = XLSX.utils.aoa_to_sheet([cols.map(c=>c.label), ...matriz]);
    ws['!cols'] = cols.map(() => ({ wch: 22 }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Dados');
    XLSX.writeFile(wb, arquivo+'.xlsx');
  } else if (fmt === 'pdf') {
    const doc = new jspdf.jsPDF({ orientation: cols.length > 6 ? 'landscape' : 'portrait' });
    const y0 = cabecalhoPDF(doc, titulo);
    doc.autoTable({ startY: y0, head:[cols.map(c=>c.label)], body: matriz.map(l=>l.map(String)), styles:{fontSize:8}, headStyles:{fillColor:[30,58,95]} });
    doc.save(arquivo+'.pdf');
  }
}

/* Assinatura desenhada (canvas) */
function criarAssinatura(container) {
  container.innerHTML = `<div class="assin"><canvas></canvas><p class="dica">Desenhe sua assinatura aqui</p>
    <button type="button" class="btn ghost sm limpar" style="display:none">${ic('eraser')} Limpar</button></div>
    <p class="xs muted" style="margin-top:4px">Desenhe com o dedo (celular) ou com o mouse.</p>`;
  icones();
  const cv = $('canvas', container), dica = $('.dica', container), bl = $('.limpar', container);
  const ctx = cv.getContext('2d');
  let desenhando = false, vazio = true;
  const prep = () => {
    const r = window.devicePixelRatio || 1, w = cv.getBoundingClientRect().width || 300;
    cv.width = w*r; cv.height = 180*r; ctx.setTransform(r,0,0,r,0,0);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1e293b'; ctx.lineWidth=2.5;
  };
  requestAnimationFrame(prep);
  const pos = e => { const b = cv.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; return { x:t.clientX-b.left, y:t.clientY-b.top }; };
  const ini = e => { e.preventDefault(); desenhando = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  const mov = e => { if(!desenhando) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); if(vazio){ vazio=false; dica.style.display='none'; bl.style.display=''; } };
  const fim = () => { desenhando = false; };
  cv.addEventListener('mousedown',ini); cv.addEventListener('mousemove',mov); cv.addEventListener('mouseup',fim); cv.addEventListener('mouseleave',fim);
  cv.addEventListener('touchstart',ini,{passive:false}); cv.addEventListener('touchmove',mov,{passive:false}); cv.addEventListener('touchend',fim);
  const limpar = () => { ctx.clearRect(0,0,cv.width,cv.height); vazio = true; dica.style.display=''; bl.style.display='none'; };
  bl.onclick = limpar;
  return { vazio: () => vazio, dataUrl: () => vazio ? null : cv.toDataURL('image/png'), limpar };
}

/* Calendário mensal reutilizável
   eventos: Map 'yyyy-mm-dd' -> [{ texto, cor, icon, detalhe(html) }] */
function montarCalendario(container, { eventos, compacto=false, maxDia=3, detalheEl, limitarAno=false }) {
  let ref = new Date(); ref.setDate(1);
  let sel = null;
  const anoAtual = new Date().getFullYear();
  const desenhar = () => {
    const ini = new Date(ref.getFullYear(), ref.getMonth(), 1);
    const inicioGrade = new Date(ini); inicioGrade.setDate(1 - ini.getDay());
    const fimMes = new Date(ref.getFullYear(), ref.getMonth()+1, 0);
    const fimGrade = new Date(fimMes); fimGrade.setDate(fimMes.getDate() + (6 - fimMes.getDay()));
    const hoje = ymd(new Date());
    const podeVoltar = !limitarAno || !(ref.getFullYear()===anoAtual && ref.getMonth()===0);
    const podeAvancar = !limitarAno || !(ref.getFullYear()===anoAtual && ref.getMonth()===11);
    let dias = '';
    for (let d = new Date(inicioGrade); d <= fimGrade; d.setDate(d.getDate()+1)) {
      const k = ymd(d), evs = eventos.get(k) || [];
      dias += `<button class="cal-dia ${d.getMonth()!==ref.getMonth()?'fora':''} ${k===hoje?'hoje':''} ${k===sel?'sel':''}" data-dia="${k}">
        <span class="n">${d.getDate()}</span>
        ${evs.slice(0,maxDia).map(e => `<span class="cal-ev ${e.cor||'c-slate'}">${esc(e.texto)}</span>`).join('')}
        ${evs.length>maxDia?`<span class="xs muted">+${evs.length-maxDia}${compacto?'':' mais'}</span>`:''}</button>`;
    }
    container.innerHTML = `<div class="cal ${compacto?'compacto':''}">
      <div class="between mb"><h3 style="text-transform:capitalize">${MESES[ref.getMonth()]} ${ref.getFullYear()}</h3>
        <div class="row"><button class="btn outline sm icon" data-nav="-1" ${podeVoltar?'':'disabled'}>${ic('chevron-left')}</button>
        <button class="btn outline sm" data-nav="0">Hoje</button>
        <button class="btn outline sm icon" data-nav="1" ${podeAvancar?'':'disabled'}>${ic('chevron-right')}</button></div></div>
      <div class="cal-sem">${(compacto?['D','S','T','Q','Q','S','S']:['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']).map(x=>`<div>${x}</div>`).join('')}</div>
      <div class="cal-grid">${dias}</div></div>`;
    icones();
    $$('[data-nav]', container).forEach(b => b.onclick = () => {
      const n = +b.dataset.nav;
      if (n===0) { ref = new Date(); ref.setDate(1); sel = ymd(new Date()); } else ref = new Date(ref.getFullYear(), ref.getMonth()+n, 1);
      desenhar(); detalhe();
    });
    $$('[data-dia]', container).forEach(b => b.onclick = () => { sel = b.dataset.dia; desenhar(); detalhe(); });
  };
  const detalhe = () => {
    if (!detalheEl) return;
    if (!sel) { detalheEl.innerHTML = `<p class="vazio">Clique em um dia para ver os detalhes</p>`; return; }
    const evs = eventos.get(sel) || [];
    detalheEl.innerHTML = `<h3 class="mb">${fDiaMes(parseYmd(sel))}</h3>` + (evs.length===0 ? `<p class="muted small">Nenhum evento neste dia</p>` :
      `<div class="stack">${evs.map(e => `<div class="row" style="align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--border);border-radius:8px;background:#f8fafc">
        <span class="badge ${e.cor||'c-slate'}" style="padding:5px">${ic(e.icon||'calendar')}</span><div class="grow">${e.detalhe||esc(e.texto)}</div></div>`).join('')}</div>`);
    icones();
  };
  desenhar(); detalhe();
}

/* Leitura de CSV (separador ; ou ,) */
function lerCSV(texto) {
  texto = texto.replace(/^\ufeff/, '');
  const primeira = texto.split(/\r?\n/)[0] || '';
  const sep = (primeira.split(';').length >= primeira.split(',').length) ? ';' : ',';
  const linhas = []; let campo = '', linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) { if (c === '"') { if (texto[i+1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += c; }
    else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && texto[i+1] === '\n') i++; linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else campo += c;
  }
  if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(v => String(v).trim() !== ''));
}

/* Converte texto de cargo (ex.: "000854-TECNICO DE ENFERMAGEM") para o código interno */
function mapearCargo(txt) {
  if (!txt) return 'outro';
  if (CARGOS[txt]) return txt;
  const t = norm(txt);
  for (const [k,l] of Object.entries(CARGOS)) if (norm(l) === t) return k;
  const tem = (...p) => p.every(x => t.includes(x));
  if (tem('coord','enferm')) return 'coordenador_enfermagem';
  if (tem('coord')) return 'coordenador_administrativo';
  if (tem('tecnico','enferm')) return 'tecnico_enfermagem';
  if (tem('tecnico','farm')) return 'tecnico_farmacia';
  if (tem('tecnico','radio')) return 'tecnico_radiologia';
  if (tem('enferm')) return 'enfermeiro';
  if (tem('farmac')) return 'farmaceutico';
  if (tem('medic')) return 'medico';
  if (tem('maqueir')) return 'maqueiro';
  if (tem('vigilan')) return 'vigilante';
  if (tem('servicos gerais')) return 'auxiliar_servicos_gerais';
  if (tem('assistente social')) return 'assistente_social';
  if (tem('almoxarif')) return 'almoxarife';
  if (tem('administrativ')) return 'administrativo';
  if (t === 'rh') return 'rh';
  if (tem('gestor')) return 'gestor';
  return 'outro';
}
function mapearCoordenacao(txt) {
  const t = norm(txt);
  if (!t || t === '—' || t === '-' || t === 'nenhuma') return 'NENHUMA';
  if (t === 'adm') return 'ADM';
  if (t.startsWith('enferm')) return 'Enfermagem';
  if (t.startsWith('medic')) return 'Medica';
  return 'NENHUMA';
}

/* Converte linhas importadas (CSV/Excel exportado do Base44) em registros de profissional */
function linhasParaProfissionais(linhas) {
  if (linhas.length < 2) return [];
  const mapa = { nome:'nome', matricula:'matricula', cargo:'cargo', coordenacao:'coordenacao', conselho:'conselho_tipo', conselho_tipo:'conselho_tipo',
    'no conselho':'conselho_numero', 'n conselho':'conselho_numero', 'numero do conselho':'conselho_numero', 'nº conselho':'conselho_numero', conselho_numero:'conselho_numero',
    setor:'setor', telefone:'telefone', 'e-mail':'email', email:'email', ativo:'ativo', tipo_plantao_padrao:'tipo_plantao_padrao' };
  const cab = linhas[0].map(h => { const n = norm(h).replace(/[º°]/g,'o').replace(/\s+/g,' '); return mapa[n] || mapa[n.replace('no ','n ')] || null; });
  return linhas.slice(1).map(l => {
    const r = {}; cab.forEach((k,i) => { if (k) r[k] = String(l[i] ?? '').trim(); });
    if (!r.nome) return null;
    const p = {
      nome: r.nome, matricula: r.matricula || null,
      cargo: mapearCargo(r.cargo), cargo_descricao: r.cargo || null,
      coordenacao: mapearCoordenacao(r.coordenacao),
      conselho_tipo: CONSELHOS[(r.conselho_tipo||'').toUpperCase()] ? r.conselho_tipo.toUpperCase() : 'NENHUM',
      conselho_numero: r.conselho_numero || null, setor: r.setor || null,
      telefone: r.telefone || null, email: r.email || null, ativo: true,
    };
    // No export do Base44 a coluna "Telefone" às vezes traz a data de admissão (dd/mm/aaaa)
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(p.telefone || '');
    if (m) { p.data_admissao = `${m[3]}-${m[2]}-${m[1]}`; p.telefone = null; }
    if (TIPOS_PLANTAO[r.tipo_plantao_padrao]) p.tipo_plantao_padrao = r.tipo_plantao_padrao;
    return p;
  }).filter(Boolean);
}

/* Exporta plantões como .ics (Google Agenda, Outlook, Apple) */
function exportarICS(plantoes, nome) {
  const f = (dt, h) => ymd(dt).replace(/-/g,'') + 'T' + (h||'08:00').replace(':','') + '00';
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//GestaoSaude RH//PT//\r\nCALSCALE:GREGORIAN\r\n', n = 0;
  const agora = new Date(), stamp = ymd(agora).replace(/-/g,'')+'T'+pad(agora.getHours())+pad(agora.getMinutes())+'00';
  plantoes.filter(p => p.data && p.tipo !== 'folga').forEach(p => {
    const d = parseYmd(p.data), hi = p.hora_inicio || '08:00', hf = p.hora_fim || '17:00';
    const fimD = new Date(d); if (hf <= hi) fimD.setDate(fimD.getDate()+1);
    ics += `BEGIN:VEVENT\r\nUID:${p.id}@gestaosaude-rh\r\nDTSTAMP:${stamp}\r\nDTSTART:${f(d,hi)}\r\nDTEND:${f(fimD,hf)}\r\nSUMMARY:Plantão - ${nome||'Escala'}\r\n`;
    if (p.observacao) ics += `DESCRIPTION:${p.observacao.replace(/\r?\n/g,'\\n')}\r\n`;
    ics += 'END:VEVENT\r\n'; n++;
  });
  ics += 'END:VCALENDAR\r\n';
  if (!n) return erro('Nenhum plantão válido para sincronizar');
  baixar(new Blob([ics], {type:'text/calendar;charset=utf-8'}), 'minha-escala.ics');
  ok(`${n} plantão(ões) exportado(s)! Importe em sua agenda (Google, Outlook, Apple).`);
}

/* Imagem (assinatura) → dataURL para colocar no PDF */
async function imagemDataUrl(url) {
  try { const b = await (await fetch(url)).blob(); return await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); }
  catch { return null; }
}

/* Gera o comprovante em PDF de uma solicitação (com as assinaturas) */
async function pdfSolicitacao(s, nomeProf='') {
  const t = TIPOS_SOL[s.tipo], doc = new jspdf.jsPDF();
  const y0 = cabecalhoPDF(doc, t?.titulo || s.titulo || 'Solicitação', 'Comprovante de solicitação — UPA Rocinha / Gestão de RH');
  const linhas = [
    ['Colaborador', nomeProf || '—'], ['Matrícula', s.matricula || '—'], ['Tipo', t?.label || s.tipo], ['Status', STATUS[s.status]?.label || s.status],
    ['Data de início', fData(s.data_inicio)], ...(s.data_fim ? [['Data de fim', fData(s.data_fim)]] : []),
    ...(s.profissional_envolvido ? [['Profissional (troca)', s.profissional_envolvido]] : []),
    ...(s.horas != null ? [['Horas', s.horas + 'h']] : []), ...(s.valor != null ? [['Valor', fMoeda(s.valor)]] : []),
    ['Descrição', s.descricao || '—'],
    ['Aprovação do gestor', s.aprovado_gestor_por ? `${s.aprovado_gestor_por} em ${fDataHora(s.data_aprovacao_gestor)}` : '—'],
    ['Observação do gestor', s.observacao_gestor || '—'],
    ['Aprovação do RH', s.aprovado_rh_por ? `${s.aprovado_rh_por} em ${fDataHora(s.data_aprovacao_rh)}` : '—'],
    ['Observação do RH', s.observacao_rh || '—'],
    ...(s.anexo_url ? [['Anexo', s.anexo_url]] : []),
    ['Criado em', fDataHora(s.created_at)],
  ];
  doc.autoTable({ startY: y0, body: linhas, theme:'grid', styles:{ fontSize:9, cellPadding:2.5 }, columnStyles:{ 0:{ fontStyle:'bold', cellWidth:48, fillColor:[241,245,249] } } });
  let y = doc.lastAutoTable.finalY + 10;
  const assin = [['Solicitante', s.assinatura_solicitante_url], ['Gestor', s.assinatura_gestor_url], ['RH', s.assinatura_rh_url]];
  if (y > 230) { doc.addPage(); y = 20; }
  doc.setFontSize(11); doc.text('Assinaturas', 14, y); y += 4;
  for (let i = 0; i < assin.length; i++) {
    const [rot, url] = assin[i], x = 14 + i * 62;
    if (url) { const d = await imagemDataUrl(url); if (d) try { doc.addImage(d, 'PNG', x, y, 56, 24); } catch {} }
    doc.setDrawColor(150); doc.line(x, y + 27, x + 56, y + 27);
    doc.setFontSize(8); doc.text(rot, x + 28, y + 31, { align:'center' });
  }
  doc.setFontSize(7); doc.setTextColor(120); doc.text(`Documento gerado em ${new Date().toLocaleString('pt-BR')} · ID ${s.id}`, 14, 290);
  return doc;
}

    detalhe: `<p class="small" style="font-weight:500">${esc(t?.label||x.tipo)}</p><p class="xs muted">${esc((x.hora_inicio||'') + (x.hora_fim?' às '+x.hora_fim:''))}</p>${x.observacao?`<p class="xs muted">${esc(x.observacao)}</p>`:''}` }); });
  sols.filter(s => s.status === 'aprovado' && s.data_inicio).forEach(s => { const t = TIPOS_SOL[s.tipo];
    intervaloDias(s.data_inicio, s.data_fim).forEach(k => add(k, { texto: (t?.label||s.tipo).substring(0,10), cor: t?.cor, icon: t?.icon,
      detalhe: `<p class="small" style="font-weight:500">${esc(s.titulo||t?.label)}</p><p class="xs muted">Solicitação aprovada${s.horas!=null?' · '+esc(s.horas)+'h':''}</p>` })); });

  const desenhar = () => {
    const naoLidas = notifs.filter(n => !n.lida).length;
    el.innerHTML = `<header class="portal-head"><div class="portal-wrap between" style="padding-top:10px;padding-bottom:10px">
        <div class="row">${logoHtml(40)}<div><p style="font-weight:600">Portal do Colaborador</p><p class="xs muted">${esc(NOME_UNIDADE)} — RH</p></div></div>
        <div class="row">${naoLidas?`<span class="contador" title="Notificações não lidas">${naoLidas}</span>`:''}<a class="btn ghost sm" href="#/">${ic('log-out')} Sair</a></div></div></header>
      <div class="portal-wrap stack">
        <div class="card card-b"><h1>${esc(p.nome)}</h1>
          <p class="small muted row" style="gap:16px;margin-top:4px"><span>Matrícula: <b>${esc(p.matricula||'—')}</b></span><span>Cargo: <b>${esc(cargoLabel(p))}</b></span>
          ${p.coordenacao && p.coordenacao!=='NENHUMA' ? `<span>Coordenação: <b>${esc(COORDENACOES[p.coordenacao]||p.coordenacao)}</b></span>`:''}<span>Setor: <b>${esc(p.setor||'—')}</b></span></p></div>

        <div><div class="between mb"><h2 style="margin:0">Minha Agenda</h2><button class="btn outline sm" id="ics">${ic('calendar-sync')} Sincronizar</button></div>
          <div class="card card-b"><div id="cal"></div><div id="cal-det" class="mt"></div></div></div>

        ${notifs.length?`<div><div class="between mb"><h2 style="margin:0">Notificações</h2>${naoLidas?`<button class="btn ghost sm" id="todas-lidas">Marcar todas como lidas</button>`:''}</div>
          <div class="stack">${notifs.map(n => `<div class="card card-b row" style="align-items:flex-start;${n.lida?'opacity:.65':''}">
            <span class="${n.lida?'muted':''}">${ic('bell')}</span><div class="grow"><p style="font-weight:500" class="small">${esc(n.titulo)}</p>
            ${n.mensagem?`<p class="xs muted">${esc(n.mensagem)}</p>`:''}<p class="xs muted">${fDataHora(n.created_at)}</p></div>
            ${n.lida?'':`<button class="btn ghost sm" data-lida="${n.id}">Marcar lida</button>`}</div>`).join('')}</div></div>`:''}

        ${plant.length?`<div><h2>Minha Escala</h2><div class="stack">${plant.slice(0,60).map(x => { const t = TIPOS_PLANTAO[x.tipo];
          return `<div class="card card-b row"><span class="badge ${t?.cor||'c-slate'}" style="padding:7px">${ic(t?.icon||'calendar')}</span><div class="grow">
          <p class="small" style="font-weight:500">${esc(t?.label||x.tipo)}</p><p class="xs muted">${fData(x.data)}${x.hora_inicio?` · ${esc(x.hora_inicio)} às ${esc(x.hora_fim||'')}`:''}</p>
          ${x.observacao?`<p class="xs muted">${esc(x.observacao)}</p>`:''}</div></div>`; }).join('')}</div></div>`:''}

        ${coms.length?`<div><h2>Comunicados</h2><div class="stack">${coms.map(c => `<div class="card card-b" style="border-left:4px solid ${c.prioridade==='urgente'?'#e11d48':c.prioridade==='importante'?'#f59e0b':'#60a5fa'}">
          <div class="row" style="margin-bottom:4px"><p style="font-weight:600" class="small">${esc(c.titulo)}</p>${c.prioridade!=='normal'?`<span class="badge ${PRIORIDADES[c.prioridade]?.cor}">${esc(PRIORIDADES[c.prioridade]?.label)}</span>`:''}</div>
          <p class="small" style="white-space:pre-wrap;color:#475569">${esc(c.conteudo)}</p>${c.autor?`<p class="xs muted mt">Por ${esc(c.autor)} · ${fData(c.created_at)}</p>`:''}</div>`).join('')}</div></div>`:''}

        <div><div class="between mb"><h2 style="margin:0">Minhas Solicitações</h2><a class="btn sm" href="#/nova-solicitacao?matricula=${encodeURIComponent(p.matricula)}">${ic('plus')} Nova Solicitação</a></div>
          ${sols.length===0?`<div class="card"><p class="vazio">Você ainda não tem solicitações. Clique em "Nova Solicitação" para criar.</p></div>`:
          `<div class="card list">${sols.map(s => itemSolicitacao(s)).join('')}</div>`}</div>
      </div>`;
    icones();
    montarCalendario($('#cal'), { eventos, compacto:true, maxDia:2, detalheEl: $('#cal-det'), limitarAno:true });
    $('#ics').onclick = () => plant.length ? exportarICS(plant, p.nome) : erro('Nenhum plantão para sincronizar');
    $$('[data-sol]').forEach(b => b.onclick = () => abrirDetalheSolicitacao(sols.find(s => s.id === b.dataset.sol), { nomeProf: p.nome }));
    $$('[data-lida]').forEach(b => b.onclick = async () => {
      try { await dbq(sb.rpc('portal_marcar_lida', { p_matricula: p.matricula, p_id: b.dataset.lida })); notifs = notifs.map(n => n.id===b.dataset.lida ? {...n, lida:true} : n); desenhar(); } catch {}
    });
    const tl = $('#todas-lidas');
    if (tl) tl.onclick = async () => { try { await dbq(sb.rpc('portal_marcar_lida', { p_matricula: p.matricula, p_id: null })); notifs = notifs.map(n => ({...n, lida:true})); desenhar(); } catch {} };
  };
  desenhar();
}

/* Nova solicitação — usada no portal (por matrícula) e na área de gestão (logado) */
async function pageNovaSolicitacao(el, params, ctx = {}) {
  const logado = !!ctx.admin;
  let matricula = params.matricula || '';
  let tipo = params.type || null;
  let anexoUrl = '';
  const voltarPara = () => matricula && !logado ? `#/portal/${encodeURIComponent(matricula)}` : (logado ? '#/admin/minhas-solicitacoes' : '#/');

  const casca = html => logado ? html : `<div class="portal-wrap" style="padding-top:28px;max-width:760px">${html}</div>`;
  const desenhar = () => {
    const t = tipo ? TIPOS_SOL[tipo] : null;
    if (!t) {
      el.innerHTML = casca(`${logado?'':`<a href="${voltarPara()}" class="row small muted mb">${ic('arrow-left')} Voltar</a>`}
        <div class="page-head"><div><h1>Nova Solicitação</h1><p class="muted">Selecione o tipo de solicitação que deseja enviar</p></div></div>
        <div class="grid g3">${Object.entries(TIPOS_SOL).map(([k,v]) => `<button class="tile ${v.cor}" data-tipo="${k}">${ic(v.icon,'ic-lg')}<div><p style="font-weight:600">${esc(v.label)}</p><p class="xs" style="opacity:.8">${esc(v.descricao)}</p></div></button>`).join('')}</div>`);
      icones();
      $$('[data-tipo]').forEach(b => b.onclick = () => { tipo = b.dataset.tipo; desenhar(); });
      return;
    }
    const c = t.campos, tem = x => c.includes(x);
    el.innerHTML = casca(`<button class="btn ghost sm mb" id="voltar-tipos">${ic('arrow-left')} Voltar aos tipos</button>
      <div class="row mb" style="gap:12px"><span class="badge ${t.cor}" style="padding:10px;border-radius:12px">${ic(t.icon,'ic-lg')}</span><div><h1>${esc(t.label)}</h1><p class="muted">${esc(t.descricao)}</p></div></div>
      <div class="card card-b">
        ${!logado && !params.matricula ? `<div class="campo"><label class="lb">Sua matrícula *</label><input class="inp" id="f-matricula" value="${esc(matricula)}"></div>` : ''}
        ${tem('data_inicio')?`<div class="grid g2"><div class="campo"><label class="lb">${tem('data_fim')?'Data de início':'Data'}</label><input type="date" class="inp" id="f-data_inicio"></div>
          ${tem('data_fim')?`<div class="campo"><label class="lb">Data de fim</label><input type="date" class="inp" id="f-data_fim"></div>`:''}</div>`:''}
        ${tem('profissional_envolvido')?`<div class="campo"><label class="lb">Profissional para troca</label><input class="inp" id="f-profissional_envolvido" placeholder="Nome do profissional"></div>`:''}
        ${tem('horas')?`<div class="campo"><label class="lb">${tipo==='bh'?'Horas de BH':tipo==='bh_casa'?'Horas':'Horas extras'}</label><input type="number" step="0.5" class="inp" id="f-horas" placeholder="Ex.: 8"></div>`:''}
        ${tem('valor')?`<div class="campo"><label class="lb">Valor do plantão (R$)</label><input type="number" step="0.01" class="inp" id="f-valor" placeholder="Ex.: 500.00"></div>`:''}
        ${tem('descricao')?`<div class="campo"><label class="lb">Descrição / observações</label><textarea class="inp" rows="4" id="f-descricao" placeholder="Descreva os detalhes da solicitação..."></textarea></div>`:''}
        ${tem('anexo')?`<div class="campo"><label class="lb">Anexar atestado / documento</label><div class="row"><button class="btn outline sm" id="btn-anexo">${ic('upload')} Anexar arquivo</button><span id="anexo-ok" class="small" style="color:#047857"></span></div>
          <input type="file" id="f-anexo" hidden accept="image/*,.pdf"></div>`:''}
        <div class="campo"><p class="lb row" style="gap:6px">${ic('pen-line')} Assinatura do solicitante</p><div id="assin"></div></div>
        <p class="caixa cx-amber small">Esta solicitação será enviada para aprovação do gestor e, em seguida, do RH.</p>
        <div class="row mt" style="justify-content:flex-end"><button class="btn outline" id="cancelar">Cancelar</button><button class="btn" id="enviar">${ic('send')} Enviar Solicitação</button></div>
      </div>`);
    icones();
    const assin = criarAssinatura($('#assin'));
    $('#voltar-tipos').onclick = $('#cancelar').onclick = () => { tipo = null; desenhar(); };
    const bA = $('#btn-anexo');
    if (bA) {
      bA.onclick = () => $('#f-anexo').click();
      $('#f-anexo').onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        bA.disabled = true; bA.textContent = 'Enviando...';
        try { anexoUrl = await enviarArquivo(f, 'atestados'); $('#anexo-ok').textContent = 'Arquivo anexado ✓'; ok('Arquivo enviado'); }
        catch { erro('Erro ao enviar arquivo'); }
        bA.disabled = false; bA.innerHTML = `${ic('upload')} Anexar arquivo`; icones();
      };
    }
    $('#enviar').onclick = async () => {
      const v = id => ($('#f-'+id)?.value ?? '').trim();
      if ($('#f-matricula')) matricula = v('matricula');
      if (!logado && !matricula) return erro('Informe sua matrícula');
      if (tem('data_inicio') && !v('data_inicio')) return erro('Informe a data');
      if (assin.vazio()) return erro('Desenhe sua assinatura para confirmar a solicitação');
      const b = $('#enviar'); b.disabled = true; b.textContent = 'Enviando...';
      try {
        const assinaturaUrl = await enviarAssinatura(assin.dataUrl());
        const dados = { tipo, matricula: matricula || null, titulo: t.titulo, descricao: v('descricao'),
          data_inicio: v('data_inicio') || null, data_fim: v('data_fim') || null, profissional_envolvido: v('profissional_envolvido'),
          horas: v('horas') ? Number(v('horas')) : null, valor: v('valor') ? Number(v('valor')) : null,
          status: 'pendente_gestor', anexo_url: anexoUrl, assinatura_solicitante_url: assinaturaUrl };
        if (logado) await dbq(sb.from('solicitacoes').insert(dados));
        else await dbq(sb.rpc('portal_nova_solicitacao', { p: dados }));
        ok('Solicitação enviada para aprovação do gestor');
        location.hash = voltarPara();
      } catch (e) { erro(String(e?.message||'').includes('Matrícula') ? 'Matrícula inválida ou inativa' : 'Erro ao enviar solicitação'); b.disabled = false; b.innerHTML = `${ic('send')} Enviar Solicitação`; icones(); }
    };
  };
  desenhar();
}

function pageLogin(el, params) {
  const destino = params.returnTo || '#/admin';
  el.innerHTML = `<div class="centro"><div class="card cx-login"><div class="card-b" style="padding:28px">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:20px">${logoHtml(100)}

    <form id="f"><div class="campo"><label class="lb">E-mail</label><input class="inp" id="email" type="email" autocomplete="email" required autofocus></div>
    <div class="campo"><div class="between"><label class="lb">Senha</label><a href="#" id="esqueci" class="xs">Esqueci a senha</a></div><input class="inp" id="senha" type="password" autocomplete="current-password" required></div>
    <p id="msg" class="caixa cx-red small mb" style="display:none"></p>
    <button class="btn block" id="entrar">Entrar</button></form>
    <a href="#/" class="row xs muted" style="justify-content:center;margin-top:14px">${ic('arrow-left')} Voltar ao portal</a>
  </div></div></div>`;
  icones();
  $('#f').onsubmit = async e => {
    e.preventDefault(); $('#msg').style.display = 'none'; $('#entrar').disabled = true; $('#entrar').textContent = 'Entrando...';
    const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#senha').value });
    if (error) { $('#msg').textContent = 'E-mail ou senha incorretos'; $('#msg').style.display = ''; $('#entrar').disabled = false; $('#entrar').textContent = 'Entrar'; return; }
    location.hash = destino;
  };
  $('#esqueci').onclick = async e => {
    e.preventDefault();
    const email = $('#email').value.trim();
    if (!email) return erro('Digite seu e-mail no campo acima');
    await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    ok('Se o e-mail estiver cadastrado, você receberá um link para criar nova senha.');
  };
}

let usuarioAtual = null;   // { id, email, nome, papel }

async function carregarUsuario() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { usuarioAtual = null; return null; }
  const u = session.user;
  let perfil = null;
  try { perfil = (await dbq(sb.from('perfis').select('*').eq('id', u.id).limit(1)))[0]; } catch {}
  usuarioAtual = { id: u.id, email: u.email, nome: perfil?.nome || u.user_metadata?.full_name || u.email, papel: perfil?.papel || 'user' };
  return usuarioAtual;
}
const nomeUsuario = () => usuarioAtual?.nome || usuarioAtual?.email || 'Sistema';

async function layoutAdmin(el, caminho, pagina, params) {
  if (!usuarioAtual) await carregarUsuario();
  if (!usuarioAtual) { location.hash = '#/login?returnTo=' + encodeURIComponent(location.hash || '#/admin'); return; }
  el.innerHTML = `<div class="admin">
    <aside class="sidebar" id="sb"><div class="brand">${logoHtml(46)}<div><p style="font-weight:700">${esc(NOME_UNIDADE)}</p><p class="xs muted">Gestão de RH</p></div></div>

      <div class="rodape"><p class="small trunc" style="font-weight:500">${esc(nomeUsuario())}</p><p class="xs muted mb">${usuarioAtual.papel==='admin'?'Administrador':'Usuário'}</p>
        <a href="#/" class="btn ghost sm block" style="justify-content:flex-start">${ic('arrow-left')} Voltar ao portal</a>
        <button class="btn ghost sm block" style="justify-content:flex-start" id="sair">${ic('log-out')} Sair</button></div></aside>
    <div class="overlay" id="ov"></div>
    <div class="main"><header class="topbar"><button class="btn ghost sm icon" id="menu">${ic('menu')}</button><span style="font-weight:600">${esc(NOME_UNIDADE)} — RH</span><span style="width:32px"></span></header>
      <div class="main-inner" id="conteudo"><div class="carregando"><div class="spin"></div></div></div></div></div>`;
  icones();
  const abre = v => { $('#sb').classList.toggle('aberta', v); $('#ov').classList.toggle('on', v); };

  icones();

    `<div class="row"><input type="file" id="imp" hidden>
      <button class="btn outline sm" id="btn-imp">${ic('upload')}Importar CSV/Excel</button>${botoesExportar()}<button class="btn sm" id="novo">${ic('user-plus')}Cadastrar</button></div>`) +
    `<div class="row mb"><div class="busca grow" style="max-width:420px">${ic('search')}<input class="inp" id="busca" placeholder="Buscar por nome, matrícula ou setor..."></div>
      <label class="check"><input type="checkbox" id="inativos"> Mostrar inativos</label><span class="small muted" id="total"></span></div>
    <div class="card"><div class="tabela-wrap" id="tab">${carregando}</div></div>`;
  icones();
  const desenhar = () => {
    const f = filtrados();
    $('#total').textContent = `${f.length} profissional(is)`;
    $('#tab').innerHTML = f.length === 0 ? '<p class="vazio">Nenhum profissional encontrado</p>' :
      `<table class="tb"><thead><tr><th>Nome</th><th>Matrícula</th><th>Cargo</th><th>Coordenação</th><th>Conselho</th><th>Setor</th><th>Contato</th><th>Plantão</th><th class="tr">Ações</th></tr></thead><tbody>
      ${f.map(p => `<tr style="${p.ativo?'':'opacity:.55'}"><td style="font-weight:500">${esc(p.nome)}${p.ativo?'':' <span class="badge c-slate">Inativo</span>'}</td><td>${esc(p.matricula||'—')}</td><td>${esc(cargoLabel(p))}</td>
        <td>${esc(p.coordenacao && p.coordenacao!=='NENHUMA' ? COORDENACOES[p.coordenacao] : '—')}</td>
        <td>${p.conselho_tipo && p.conselho_tipo!=='NENHUM' ? esc(p.conselho_tipo+' '+(p.conselho_numero||'')) : '—'}</td><td>${esc(p.setor||'—')}</td>
        <td class="small">${esc(p.telefone || p.email || '—')}</td>
        <td><button class="btn outline sm" data-plant="${p.id}">${ic('calendar')}Plantões</button></td>
        <td class="tr" style="white-space:nowrap"><button class="btn ghost sm icon" data-edit="${p.id}" title="Editar">${ic('pencil')}</button><button class="btn ghost sm icon" data-del="${p.id}" title="Excluir" style="color:#e11d48">${ic('trash-2')}</button></td></tr>`).join('')}
      </tbody></table>`;
    icones();
    $$('[data-edit]', el).forEach(b => b.onclick = () => formProfissional(lista.find(p => p.id===b.dataset.edit)));
    $$('[data-plant]', el).forEach(b => b.onclick = () => modalPlantoesProfissional(lista.find(p => p.id===b.dataset.plant)));
    $$('[data-del]', el).forEach(b => b.onclick = async () => {
      if (!confirm('Excluir este profissional? Os plantões, documentos e férias dele também serão apagados.')) return;
      try { await dbq(sb.from('profissionais').delete().eq('id', b.dataset.del)); ok('Profissional excluído'); carregar(); } catch { erro('Erro ao excluir'); }
    });
  };
  const formProfissional = (p) => {
    const d = p ? {...p} : { nome:'', matricula:'', cargo:'outro', coordenacao:'NENHUMA', conselho_tipo:'NENHUM', conselho_numero:'', setor:'', telefone:'', email:'', tipo_plantao_padrao:'sem_padrao', ativo:true };
    const plantOpts = `<option value="sem_padrao">Sem padrão</option>` + Object.entries(TIPOS_PLANTAO).filter(([k]) => k!=='folga').map(([k,v]) => `<option value="${k}" ${d.tipo_plantao_padrao===k?'selected':''}>${esc(v.label)}</option>`).join('');
    modal({ titulo: p ? 'Editar Profissional' : 'Cadastrar Profissional', largo:true,
      corpo: `<div class="grid g2">
        <div class="campo" style="grid-column:1/-1"><label class="lb">Nome *</label><input class="inp" id="p-nome" value="${esc(d.nome)}"></div>
        <div class="campo"><label class="lb">Matrícula</label><input class="inp" id="p-matricula" value="${esc(d.matricula||'')}"></div>
        <div class="campo"><label class="lb">Cargo</label><select class="inp" id="p-cargo">${opts(CARGOS, d.cargo)}</select>${d.cargo_descricao?`<p class="xs muted" style="margin-top:3px">Original: ${esc(d.cargo_descricao)}</p>`:''}</div>
        <div class="campo"><label class="lb">Coordenação</label><select class="inp" id="p-coordenacao"><option value="NENHUMA">Nenhuma</option>${['ADM','Enfermagem','Medica'].map(k => `<option value="${k}" ${d.coordenacao===k?'selected':''}>${COORDENACOES[k]}</option>`).join('')}</select></div>
        <div class="campo"><label class="lb">Conselho</label><select class="inp" id="p-conselho_tipo">${opts(CONSELHOS, d.conselho_tipo)}</select></div>
        <div class="campo"><label class="lb">Número do conselho</label><input class="inp" id="p-conselho_numero" value="${esc(d.conselho_numero||'')}"></div>
        <div class="campo"><label class="lb">Setor</label><input class="inp" id="p-setor" value="${esc(d.setor||'')}"></div>
        <div class="campo"><label class="lb">Telefone</label><input class="inp" id="p-telefone" value="${esc(d.telefone||'')}"></div>
        <div class="campo"><label class="lb">E-mail</label><input class="inp" type="email" id="p-email" value="${esc(d.email||'')}"></div>
        <div class="campo"><label class="lb">Data de admissão</label><input class="inp" type="date" id="p-data_admissao" value="${esc(d.data_admissao||'')}"></div>
        <div class="campo" style="grid-column:1/-1"><label class="lb">Tipo de plantão padrão (para gerar escalas)</label><select class="inp" id="p-tipo_plantao_padrao">${plantOpts}</select></div>
        <label class="check"><input type="checkbox" id="p-ativo" ${d.ativo?'checked':''}> Profissional ativo</label></div>`,
      rodape: `<button class="btn outline" data-fechar>Cancelar</button><button class="btn" id="p-salvar">Salvar</button>`,
      aoAbrir: m => m.$('#p-salvar').onclick = async () => {
        const v = k => m.$('#p-'+k).value.trim();
        const reg = { nome:v('nome'), matricula:v('matricula')||null, cargo:v('cargo'), coordenacao:v('coordenacao'), conselho_tipo:v('conselho_tipo'),
          conselho_numero:v('conselho_numero'), setor:v('setor'), telefone:v('telefone'), email:v('email'), data_admissao:v('data_admissao')||null,
          tipo_plantao_padrao:v('tipo_plantao_padrao'), ativo:m.$('#p-ativo').checked };
        if (!reg.nome) return erro('Nome é obrigatório');
        try {
          if (p) await dbq(sb.from('profissionais').update(reg).eq('id', p.id)); else await dbq(sb.from('profissionais').insert(reg));
          ok(p ? 'Profissional atualizado' : 'Profissional cadastrado'); m.fechar(); carregar();
        } catch (e) { erro(String(e.message||'').includes('duplicate') ? 'Já existe um profissional com essa matrícula' : 'Erro ao salvar'); }
      }
    });
  };
  $('#novo').onclick = () => formProfissional(null);
  $('#busca').oninput = e => { busca = e.target.value; desenhar(); };
  $('#inativos').onchange = e => { mostrarInativos = e.target.checked; desenhar(); };
  ligarExportar(el, fmt => exportar(fmt, 'profissionais', 'Lista de Profissionais', COLS_PROF, filtrados().map(p => ({...p,
    cargo: cargoLabel(p), coordenacao: p.coordenacao && p.coordenacao!=='NENHUMA' ? COORDENACOES[p.coordenacao] : '—' }))));
  $('#btn-imp').onclick = () => $('#imp').click();
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      let linhas;
      if (/\.csv$/i.test(f.name)) linhas = lerCSV(await f.text());
      else { const wb = XLSX.read(await f.arrayBuffer(), { type:'array' }); linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:false, defval:'' }); }
      const regs = linhasParaProfissionais(linhas);
      if (!regs.length) return erro('Nenhum registro válido no arquivo');
      const existentes = new Set(lista.map(p => p.matricula).filter(Boolean));
      const novos = regs.filter(r => !r.matricula || !existentes.has(r.matricula)).length;
      if (!confirm(`${regs.length} registro(s) no arquivo.\n${novos} novo(s) e ${regs.length-novos} já existente(s) (serão atualizados pela matrícula).\n\nContinuar?`)) return;
      const nomesExistentes = new Set(lista.map(p => norm(p.nome)));
      const comMat = regs.filter(r => r.matricula), semMat = regs.filter(r => !r.matricula && !nomesExistentes.has(norm(r.nome)));
      // remove matrículas repetidas dentro do próprio arquivo
      const unicos = [...new Map(comMat.map(r => [r.matricula, r])).values()];
      if (unicos.length) await dbq(sb.from('profissionais').upsert(unicos, { onConflict:'matricula' }));
      if (semMat.length) await dbq(sb.from('profissionais').insert(semMat));
      ok(`${unicos.length + semMat.length} profissionais importados`); carregar();
    } catch (er) { console.error(er); erro('Erro ao importar arquivo'); }
  };
  carregar();
}

function modalPlantoesProfissional(prof) {
  const m = modal({ titulo: `Plantões — ${esc(prof.nome)}`, largo:true,
    corpo: `<div class="card card-b" style="background:#f8fafc;box-shadow:none"><p class="small" style="font-weight:600;margin-bottom:10px">Adicionar plantão</p>
      <div class="grid g2"><div class="campo"><label class="lb">Data</label><input type="date" class="inp" id="pl-data"></div>
      <div class="campo"><label class="lb">Tipo</label><select class="inp" id="pl-tipo">${opts(TIPOS_PLANTAO,'diarista_8h')}</select></div>
      <div class="campo"><label class="lb">Início</label><input type="time" class="inp" id="pl-ini" value="08:00"></div>
      <div class="campo"><label class="lb">Fim</label><input type="time" class="inp" id="pl-fim" value="17:00"></div>
      <div class="campo" style="grid-column:1/-1"><label class="lb">Observação</label><input class="inp" id="pl-obs" placeholder="Opcional"></div></div>
      <button class="btn sm" id="pl-add">${ic('plus')}Adicionar</button></div><div id="pl-lista" class="mt">${carregando}</div>`,
    rodape: `<button class="btn outline" data-fechar>Fechar</button>`,
  });
  m.$('#pl-tipo').onchange = e => { const t = TIPOS_PLANTAO[e.target.value]; if (t?.hora_inicio) { m.$('#pl-ini').value = t.hora_inicio; m.$('#pl-fim').value = t.hora_fim; } };
  const carregar = async () => {
    const l = await dbq(sb.from('plantoes').select('*').eq('profissional_id', prof.id).order('data',{ascending:false}).limit(200));
    m.$('#pl-lista').innerHTML = l.length===0 ? '<p class="vazio">Nenhum plantão cadastrado</p>' : `<div class="stack">${l.map(x => { const t = TIPOS_PLANTAO[x.tipo] || TIPOS_PLANTAO.diarista_8h; const d = parseYmd(x.data);
      return `<div class="row" style="padding:10px;border:1px solid var(--border);border-radius:8px"><span class="badge ${t.cor}" style="padding:6px">${ic(t.icon)}</span>
        <div class="grow"><p class="small" style="font-weight:500">${fData(x.data)} — ${DIAS_SEM[d.getDay()]}</p><p class="xs muted">${esc(t.label)} ${x.hora_inicio?`· ${esc(x.hora_inicio)} às ${esc(x.hora_fim)}`:''}${x.observacao?' · '+esc(x.observacao):''}</p></div>
        <button class="btn ghost sm icon" data-del="${x.id}" style="color:#e11d48">${ic('trash-2')}</button></div>`; }).join('')}</div>`;
    icones();
    $$('[data-del]', m.el).forEach(b => b.onclick = async () => { if (!confirm('Excluir este plantão?')) return; try { await dbq(sb.from('plantoes').delete().eq('id', b.dataset.del)); ok('Plantão excluído'); carregar(); } catch { erro('Erro ao excluir'); } });
  };
  m.$('#pl-add').onclick = async () => {
    if (!m.$('#pl-data').value) return erro('Informe a data do plantão');
    try {
      await dbq(sb.from('plantoes').insert({ profissional_id: prof.id, profissional_nome: prof.nome, data: m.$('#pl-data').value, hora_inicio: m.$('#pl-ini').value,
        hora_fim: m.$('#pl-fim').value, tipo: m.$('#pl-tipo').value, observacao: m.$('#pl-obs').value, cargo: prof.cargo }));
      ok('Plantão adicionado'); m.$('#pl-data').value = ''; m.$('#pl-obs').value = ''; carregar();
    } catch { erro('Erro ao salvar plantão'); }
  };
  carregar();
}

/* ---------------- MINHAS SOLICITAÇÕES ---------------- */
async function pageMinhasSolicitacoes(el) {
  el.innerHTML = cabecalho('Minhas Solicitações','Acompanhe o status das suas solicitações', botoesExportar()) +
    `<div class="row mb"><select class="inp" id="ft" style="width:auto">${'<option value="todos">Todos os tipos</option>'+opts(TIPOS_SOL)}</select>
     <select class="inp" id="fs" style="width:auto">${'<option value="todos">Todos os status</option>'+opts(STATUS)}</select></div><div id="lista">${carregando}</div>`;
  icones();
  const sols = await dbq(sb.from('solicitacoes').select('*').order('created_at',{ascending:false}).limit(500));
  const filtrar = () => sols.filter(s => ($('#ft').value==='todos'||s.tipo===$('#ft').value) && ($('#fs').value==='todos'||s.status===$('#fs').value));
  const desenhar = () => {
    const f = filtrar();
    $('#lista').innerHTML = f.length===0 ? '<div class="card"><p class="vazio">Nenhuma solicitação encontrada</p></div>' : `<div class="card list">${f.map(s => itemSolicitacao(s, s.matricula?`<span>Mat. ${esc(s.matricula)}</span>`:'')).join('')}</div>`;
    icones();
    $$('[data-sol]', el).forEach(b => b.onclick = () => abrirDetalheSolicitacao(sols.find(s => s.id===b.dataset.sol), { comEmail:true }));
  };
  $('#ft').onchange = $('#fs').onchange = desenhar;
  ligarExportar(el, fmt => exportar(fmt, 'minhas-solicitacoes', 'Minhas Solicitações',

    filtrar().map(s => ({ tipo: TIPOS_SOL[s.tipo]?.label||s.tipo, titulo:s.titulo, matricula:s.matricula||'', ini:fData(s.data_inicio), fim:fData(s.data_fim), st:STATUS[s.status]?.label||s.status, criado:fDataHora(s.created_at) }))));
  desenhar();
}

/* ---------------- APROVAÇÕES ---------------- */
async function pageAprovacoes(el) {
  let sols = [], aba = 'gestor';
  const carregar = async () => { sols = await dbq(sb.from('solicitacoes').select('*').order('created_at',{ascending:false}).limit(500)); desenhar(); };
  el.innerHTML = cabecalho('Aprovações','Ciência e aceite do gestor e do RH') + `<div id="corpo">${carregando}</div>`;
  const desenhar = () => {
    const listas = { gestor: sols.filter(s => s.status==='pendente_gestor'), rh: sols.filter(s => s.status==='pendente_rh'), todas: sols };
    const l = listas[aba];
    $('#corpo').innerHTML = `<div class="tabs"><button data-aba="gestor" class="${aba==='gestor'?'on':''}">Aguardando Gestor (${listas.gestor.length})</button>
      <button data-aba="rh" class="${aba==='rh'?'on':''}">Aguardando RH (${listas.rh.length})</button><button data-aba="todas" class="${aba==='todas'?'on':''}">Histórico (${listas.todas.length})</button></div>
      <div class="mb">${botoesExportar()}</div>
      ${l.length===0 ? '<div class="card"><p class="vazio">Nenhuma solicitação nesta etapa</p></div>' : `<div class="stack">${l.map(s => { const t = TIPOS_SOL[s.tipo];
        return `<div class="card card-b"><div class="row" style="align-items:flex-start;gap:12px"><div class="ico-box">${ic(t?.icon||'file')}</div><div class="grow">
          <div class="row"><p style="font-weight:600">${esc(s.titulo||t?.label)}</p>${badgeStatus(s.status)}</div>
          <p class="xs muted row" style="gap:10px;margin-top:3px">${s.matricula?`<span>Mat. ${esc(s.matricula)}</span>`:''}${s.data_inicio?`<span>${fData(s.data_inicio)}</span>`:''}${s.data_fim?`<span>→ ${fData(s.data_fim)}</span>`:''}
            ${s.horas!=null?`<span>${esc(s.horas)}h</span>`:''}${s.valor!=null?`<span>${fMoeda(s.valor)}</span>`:''}${s.profissional_envolvido?`<span>Troca: ${esc(s.profissional_envolvido)}</span>`:''}</p>
          ${s.descricao?`<p class="caixa cx-slate mt" style="margin-top:8px">${esc(s.descricao)}</p>`:''}
          ${s.anexo_url?`<a class="xs" href="${esc(s.anexo_url)}" target="_blank" rel="noreferrer">Ver anexo</a>`:''}
          ${s.observacao_gestor && aba==='rh'?`<p class="caixa cx-amber xs" style="margin-top:8px"><b>Gestor:</b> ${esc(s.observacao_gestor)} — ${esc(s.aprovado_gestor_por||'')}</p>`:''}</div>
          <div class="row" style="flex-direction:column;align-items:stretch">
            ${aba==='gestor'?`<button class="btn outline vermelho-t sm" data-acao="rejeitar_gestor" data-id="${s.id}">${ic('x')} Rejeitar</button><button class="btn verde sm" data-acao="aprovar_gestor" data-id="${s.id}">${ic('check')} Aprovar e enviar ao RH</button>`:''}
            ${aba==='rh'?`<button class="btn outline vermelho-t sm" data-acao="rejeitar_rh" data-id="${s.id}">${ic('x')} Rejeitar</button><button class="btn verde sm" data-acao="aprovar_rh" data-id="${s.id}">${ic('check')} Aprovar</button>`:''}
            ${aba==='todas'?`<button class="btn ghost sm" data-ver="${s.id}">${ic('eye')} Ver</button>`:''}</div></div></div>`; }).join('')}</div>`}`;
    icones();
    $$('[data-aba]').forEach(b => b.onclick = () => { aba = b.dataset.aba; desenhar(); });
    $$('[data-ver]').forEach(b => b.onclick = () => abrirDetalheSolicitacao(sols.find(s => s.id===b.dataset.ver), { comEmail:true }));
    $$('[data-acao]').forEach(b => b.onclick = () => decidir(sols.find(s => s.id===b.dataset.id), b.dataset.acao));
    ligarExportar($('#corpo'), fmt => exportar(fmt, 'aprovacoes', 'Aprovações',
      [{key:'tipo',label:'Tipo'},{key:'titulo',label:'Título'},{key:'mat',label:'Matrícula'},{key:'ini',label:'Data Início'},{key:'fim',label:'Data Fim'},{key:'st',label:'Status'},{key:'gestor',label:'Gestor'},{key:'rh',label:'RH'},{key:'criado',label:'Criado em'}],
      l.map(s => ({ tipo:TIPOS_SOL[s.tipo]?.label||s.tipo, titulo:s.titulo, mat:s.matricula||'', ini:fData(s.data_inicio), fim:fData(s.data_fim), st:STATUS[s.status]?.label||s.status, gestor:s.aprovado_gestor_por||'—', rh:s.aprovado_rh_por||'—', criado:fDataHora(s.created_at) }))));
  };
  const decidir = (s, acao) => {
    const aprovar = acao.startsWith('aprovar');
    let assin = null;
    modal({ titulo: aprovar ? 'Aprovar Solicitação' : 'Rejeitar Solicitação',
      corpo: `<p class="small muted mb">${aprovar ? (acao==='aprovar_gestor' ? 'Confirme a aprovação como gestor. A solicitação será encaminhada ao RH.' : 'Confirme a aprovação final do RH.') : 'Confirme a rejeição da solicitação.'}</p>
        <div class="campo"><label class="lb">Observação</label><textarea class="inp" rows="3" id="obs" placeholder="Adicione uma observação (opcional)..."></textarea></div>
        ${aprovar?`<p class="lb row" style="gap:6px">${ic('pen-line')} Assinatura do ${acao==='aprovar_gestor'?'gestor':'RH'}</p><div id="assin-ap"></div>`:''}`,
      rodape: `<button class="btn outline" data-fechar>Cancelar</button><button class="btn ${aprovar?'verde':'vermelho'}" id="conf">${aprovar?'Confirmar aprovação':'Confirmar rejeição'}</button>`,
      aoAbrir: m => {
        if (aprovar) assin = criarAssinatura(m.$('#assin-ap'));
        m.$('#conf').onclick = async () => {
          if (aprovar && assin.vazio()) return erro('Desenhe sua assinatura para aprovar');
          const b = m.$('#conf'); b.disabled = true; b.textContent = 'Processando...';
          try {
            const quem = nomeUsuario(), agora = new Date().toISOString(), obs = m.$('#obs').value.trim();
            const url = aprovar ? await enviarAssinatura(assin.dataUrl()) : '';
            const nome = s.titulo || TIPOS_SOL[s.tipo]?.label || '';
            if (acao==='aprovar_gestor') await dbq(sb.from('solicitacoes').update({ status:'pendente_rh', observacao_gestor: obs||'Aprovado pelo gestor.', aprovado_gestor_por:quem, data_aprovacao_gestor:agora, assinatura_gestor_url:url }).eq('id', s.id));
            if (acao==='rejeitar_gestor') await dbq(sb.from('solicitacoes').update({ status:'rejeitado', observacao_gestor: obs||'Rejeitado pelo gestor.', aprovado_gestor_por:quem, data_aprovacao_gestor:agora }).eq('id', s.id));
            if (acao==='aprovar_rh') await dbq(sb.from('solicitacoes').update({ status:'aprovado', observacao_rh: obs||'Aprovado pelo RH.', aprovado_rh_por:quem, data_aprovacao_rh:agora, assinatura_rh_url:url }).eq('id', s.id));
            if (acao==='rejeitar_rh') await dbq(sb.from('solicitacoes').update({ status:'rejeitado', observacao_rh: obs||'Rejeitado pelo RH.', aprovado_rh_por:quem, data_aprovacao_rh:agora }).eq('id', s.id));
            if (s.matricula && (acao==='aprovar_rh' || acao==='rejeitar_rh')) {
              const ap = acao==='aprovar_rh';
              await dbq(sb.from('notificacoes').insert({ matricula:s.matricula, tipo: ap?'solicitacao_aprovada':'solicitacao_rejeitada',
                titulo: `Solicitação ${ap?'aprovada':'rejeitada'}: ${nome}`, mensagem: `Sua solicitação foi ${ap?'aprovada':'rejeitada'} pelo RH em ${new Date().toLocaleDateString('pt-BR')}.`, lida:false }));
            }
            ok({ aprovar_gestor:'Aprovado pelo gestor — enviado para o RH', rejeitar_gestor:'Solicitação rejeitada pelo gestor', aprovar_rh:'Solicitação aprovada pelo RH', rejeitar_rh:'Solicitação rejeitada pelo RH' }[acao]);
            m.fechar(); carregar();
          } catch { erro('Erro ao processar'); b.disabled = false; b.textContent = aprovar?'Confirmar aprovação':'Confirmar rejeição'; }
        };
      }
    });
  };
  carregar();
}

/* ---------------- ESCALAS ---------------- */
function calcularCobertura(turno, equipe) {
  const min = MINIMOS[turno], cont = {};
  equipe.forEach(p => { if ((TURNO_DO_TIPO[p.tipo]||[]).includes(turno) && p._cargo) cont[p._cargo] = (cont[p._cargo]||0) + 1; });
  return Object.keys(min).map(c => ({ cargo:c, minimo:min[c], escalado:cont[c]||0, vacancia: Math.max(0, min[c] - (cont[c]||0)) }));
}

/* Gera os plantões do mês a partir do "tipo de plantão padrão" de cada profissional.
   Regras: diarista = seg a sex; 12h pares/ímpares = dia do mês par/ímpar;
   24h x 120h = a cada 6 dias; 24h semanal = 1 dia fixo por semana (dia e ciclo distribuídos pela matrícula). */
async function gerarEscalaMensal(mes, sobrescrever) {
  const [ano, m] = mes.split('-').map(Number);
  const ini = `${mes}-01`, fim = ymd(new Date(ano, m, 0));
  const profs = (await dbq(sb.from('profissionais').select('*').eq('ativo', true))).filter(p => TIPOS_PLANTAO[p.tipo_plantao_padrao] && p.tipo_plantao_padrao !== 'folga');
  if (sobrescrever) await dbq(sb.from('plantoes').delete().gte('data', ini).lte('data', fim).eq('rpa', false));
  const existentes = sobrescrever ? [] : await dbq(sb.from('plantoes').select('profissional_id,data').gte('data', ini).lte('data', fim));
  const ja = new Set(existentes.map(x => x.profissional_id + '|' + x.data));
  const novos = [];
  profs.forEach(p => {
    const t = TIPOS_PLANTAO[p.tipo_plantao_padrao], semente = (parseInt(String(p.matricula||'').replace(/\D/g,''),10) || p.nome.length);
    for (let d = new Date(ano, m-1, 1); d.getMonth() === m-1; d.setDate(d.getDate()+1)) {
      const dia = d.getDate(), sem = d.getDay(), idx = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
      let escala = false;
      switch (p.tipo_plantao_padrao) {
        case 'diarista_8h': escala = sem >= 1 && sem <= 5; break;
        case 'plantao_12h_dia_par': case 'plantao_12h_noite_par': escala = dia % 2 === 0; break;
        case 'plantao_12h_dia_impar': case 'plantao_12h_noite_impar': escala = dia % 2 === 1; break;
        case 'plantao_24h': escala = (idx + semente) % 6 === 0; break;
        case 'plantao_24h_semanal': escala = sem === semente % 7; break;
      }
      const k = ymd(d);
      if (escala && !ja.has(p.id + '|' + k)) novos.push({ profissional_id:p.id, profissional_nome:p.nome, data:k, hora_inicio:t.hora_inicio, hora_fim:t.hora_fim, tipo:p.tipo_plantao_padrao, cargo:p.cargo, rpa:false });
    }
  });
  for (let i = 0; i < novos.length; i += 500) await dbq(sb.from('plantoes').insert(novos.slice(i, i+500)));
  return `${novos.length} plantão(ões) gerado(s) para ${profs.length} profissional(is) em ${fMesAno(parseYmd(ini))}.`;
}

async function relatorioMensalPDF(mes) {
  const [ano, m] = mes.split('-').map(Number);
  const ini = `${mes}-01`, fim = ymd(new Date(ano, m, 0));
  const [plant, profs] = await Promise.all([
    dbq(sb.from('plantoes').select('*').gte('data', ini).lte('data', fim).neq('tipo','folga').order('data')),
    dbq(sb.from('profissionais').select('id,nome,cargo,cargo_descricao')),
  ]);
  const pm = Object.fromEntries(profs.map(p => [p.id, p])), agg = {};
  plant.forEach(x => { const k = x.profissional_id || 'RPA_'+x.profissional_nome; const p = pm[x.profissional_id];
    agg[k] ??= { nome: x.profissional_nome || p?.nome || '—', cargo: p ? cargoLabel(p) : (CARGOS[x.cargo]||x.cargo||'—'), plantoes:0, horas:0 };
    agg[k].plantoes++; agg[k].horas += horasEntre(x.hora_inicio, x.hora_fim); });
  const resumo = Object.values(agg).sort((a,b) => b.horas - a.horas), rpa = plant.filter(x => x.rpa);
  const doc = new jspdf.jsPDF();
  const y0 = cabecalhoPDF(doc, 'Relatório Mensal Consolidado', `${fMesAno(parseYmd(ini))} — gerado em ${new Date().toLocaleDateString('pt-BR')}`);
  doc.setFontSize(12); doc.text('Resumo de horas por profissional', 14, y0 + 2);
  doc.autoTable({ startY: y0 + 5, head:[['Profissional','Cargo','Plantões','Horas']], body: resumo.length ? resumo.map(r => [r.nome, r.cargo, r.plantoes, r.horas.toFixed(1)+'h']) : [['Nenhum plantão registrado no período','','','']], styles:{fontSize:8}, headStyles:{fillColor:[30,58,95]} });
  let y = doc.lastAutoTable.finalY + 12; if (y > 260) { doc.addPage(); y = 20; }
  doc.setFontSize(12); doc.text('Plantões extras realizados (RPA)', 14, y);
  doc.autoTable({ startY: y+3, head:[['Data','Profissional','Cargo','Turno','Horas','Valor']],
    body: rpa.length ? rpa.map(x => [fData(x.data), x.profissional_nome||'—', CARGOS[x.cargo]||x.cargo||'—', x.hora_inicio==='07:00'?'Dia':'Noite', horasEntre(x.hora_inicio,x.hora_fim).toFixed(1)+'h', x.valor?fMoeda(x.valor):'—']) : [['Nenhum plantão extra no período','','','','','']],
    styles:{fontSize:8}, headStyles:{fillColor:[109,40,217]} });
  if (rpa.length) { const h = rpa.reduce((s,x) => s + horasEntre(x.hora_inicio,x.hora_fim), 0), v = rpa.reduce((s,x) => s + (+x.valor||0), 0);
    doc.setFontSize(10); doc.text(`Total: ${rpa.length} plantão(ões) · ${h.toFixed(1)}h · ${fMoeda(v)}`, 14, doc.lastAutoTable.finalY + 8); }
  doc.save(`relatorio-escalas-${mes}.pdf`);
}

/* ---------------- INDICADORES ---------------- */
async function pageIndicadores(el) {
  el.innerHTML = carregando;
  const [plant, profs, sols] = await Promise.all([
    dbq(sb.from('plantoes').select('*').order('data',{ascending:false}).limit(10000)),
    dbq(sb.from('profissionais').select('id,nome,ativo')),
    dbq(sb.from('solicitacoes').select('*').eq('status','aprovado').limit(2000)),
  ]);
  const pm = Object.fromEntries(profs.map(p => [p.id, p]));
  let mes = ymd(new Date()).substring(0,7), graficos = [];
  const desenhar = () => {
    graficos.forEach(g => g.destroy()); graficos = [];
    const doMes = plant.filter(p => p.data && p.data.startsWith(mes) && p.tipo !== 'folga');
    const porProf = {};
    doMes.forEach(p => { const k = p.profissional_id || 'RPA_'+p.profissional_nome; const n = p.profissional_nome || pm[p.profissional_id]?.nome || '—';
      porProf[k] ??= { nome: n.length > 18 ? n.substring(0,16)+'…' : n, horas:0 }; porProf[k].horas += horasEntre(p.hora_inicio, p.hora_fim); });
    const top = Object.values(porProf).sort((a,b) => b.horas-a.horas).slice(0,15);
    const rpaMes = {};
    plant.filter(p => p.rpa && p.data).forEach(p => { const k = p.data.substring(0,7); rpaMes[k] ??= { mes:k, total:0 }; rpaMes[k].total++; });
    const ult = Object.values(rpaMes).sort((a,b) => a.mes.localeCompare(b.mes)).slice(-6);
    const doMesSol = t => sols.filter(s => t.includes(s.tipo) && s.data_inicio?.startsWith(mes)).reduce((a,s) => a + (+s.horas||0), 0);
    const kpis = [['Total de Horas', doMes.reduce((a,p) => a + horasEntre(p.hora_inicio,p.hora_fim), 0).toFixed(0)+'h','clock'], ['Plantões Extras', doMes.filter(p => p.rpa).length,'briefcase'],
      ['Horas Extras Aprov.', doMesSol(['horas_extras'])+'h','trending-up'], ['BH Aprovado', doMesSol(['bh','bh_casa'])+'h','piggy-bank']];
    const d = parseYmd(mes+'-01');
    el.innerHTML = cabecalho('Indicadores','Desempenho e horas extras', `<div class="row"><button class="btn outline icon" id="ant">${ic('chevron-left')}</button><span style="min-width:150px;text-align:center;font-weight:500;text-transform:capitalize">${fMesAno(d)}</span><button class="btn outline icon" id="prox">${ic('chevron-right')}</button></div>`) +
      `<div class="grid g4">${kpis.map(([l,v,i]) => `<div class="card card-b"><div class="between"><p class="small muted">${l}</p><span class="muted">${ic(i)}</span></div><p style="font-size:26px;font-weight:700;margin-top:6px">${v}</p></div>`).join('')}</div>
      <div class="card card-b mt-l"><h2 style="text-transform:capitalize">Distribuição de horas por profissional — ${fMesAno(d)}</h2>${top.length?'<div style="height:360px"><canvas id="g1"></canvas></div>':'<p class="vazio">Nenhum plantão registrado no mês</p>'}</div>
      <div class="card card-b mt"><h2>Plantões extras (RPA) por mês — últimos 6 meses</h2>${ult.length?'<div style="height:300px"><canvas id="g2"></canvas></div>':'<p class="vazio">Nenhum plantão extra registrado</p>'}</div>`;
    icones();
    const base = { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ x:{ grid:{display:false} }, y:{ beginAtZero:true, grid:{color:'#e2e8f0'} } } };
    if (top.length) graficos.push(new Chart($('#g1'), { type:'bar', data:{ labels: top.map(t => t.nome), datasets:[{ data: top.map(t => +t.horas.toFixed(1)), backgroundColor:'#1e3a5f', borderRadius:4 }] },
      options:{ ...base, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => `${c.parsed.y}h` } } }, scales:{ ...base.scales, x:{ grid:{display:false}, ticks:{ maxRotation:45, minRotation:45, font:{size:10} } } } } }));
    if (ult.length) graficos.push(new Chart($('#g2'), { type:'bar', data:{ labels: ult.map(u => { const x = parseYmd(u.mes+'-01'); return MESES[x.getMonth()].substring(0,3)+'/'+String(x.getFullYear()).slice(2); }),
      datasets:[{ data: ult.map(u => u.total), backgroundColor:'#7c3aed', borderRadius:4 }] }, options:{ ...base, scales:{ ...base.scales, y:{ beginAtZero:true, ticks:{ precision:0 } } } } }));
    $('#ant').onclick = () => { const x = parseYmd(mes+'-01'); x.setMonth(x.getMonth()-1); mes = ymd(x).substring(0,7); desenhar(); };
    $('#prox').onclick = () => { const x = parseYmd(mes+'-01'); x.setMonth(x.getMonth()+1); mes = ymd(x).substring(0,7); desenhar(); };
  };
  desenhar();
}

/* ---------------- DOCUMENTOS ---------------- */
const situacaoDoc = venc => {
  if (!venc) return { label:'Sem data', cor:'c-slate', key:'sem' };
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const n = Math.ceil((parseYmd(venc) - hoje) / 864e5);
  return n < 0 ? { label:'Vencido', cor:'c-red', key:'vencido' } : n <= 30 ? { label:`Vence em ${n}d`, cor:'c-amber', key:'proximo' } : { label:'Válido', cor:'c-green', key:'valido' };
};

          <p class="xs muted">${esc(DOC_TIPOS[d.tipo]||d.tipo)}${d.numero?' · '+esc(d.numero):''}${d.data_vencimento?' · Venc: '+fData(d.data_vencimento):''}</p>${d.observacao?`<p class="xs muted trunc">${esc(d.observacao)}</p>`:''}</div>
          <span class="badge ${s.cor}">${s.label}</span>${d.arquivo_url?`<a class="btn ghost sm" href="${esc(d.arquivo_url)}" target="_blank" rel="noreferrer">Ver</a>`:''}
          <button class="btn ghost sm icon" data-edit="${d.id}">${ic('pencil')}</button><button class="btn ghost sm icon" data-del="${d.id}" style="color:#e11d48">${ic('trash-2')}</button></div>`; }).join('')}</div>`}`;

    $$('[data-edit]', el).forEach(b => b.onclick = () => form(docs.find(d => d.id===b.dataset.edit)));
    $$('[data-del]', el).forEach(b => b.onclick = async () => { if (!confirm('Excluir este documento?')) return; try { await dbq(sb.from('documentos').delete().eq('id', b.dataset.del)); ok('Documento excluído'); carregar(); } catch { erro('Erro ao excluir'); } });
  };
  const form = doc => {

    modal({ titulo: doc ? 'Editar Documento' : 'Novo Documento',

        <div class="grid g2"><div class="campo"><label class="lb">Tipo de documento *</label><select class="inp" id="d-tipo">${opts(DOC_TIPOS, doc?.tipo||'outro')}</select></div>
        <div class="campo"><label class="lb">Número</label><input class="inp" id="d-num" value="${esc(doc?.numero||'')}" placeholder="Número do documento"></div></div>

        <div class="campo"><label class="lb">Arquivo</label><input type="file" class="inp" id="d-arq" style="padding-top:6px"><p class="xs" id="d-ok" style="color:#047857;margin-top:3px">${url?'Arquivo enviado ✓':''}</p></div>
        <div class="campo"><label class="lb">Observação</label><textarea class="inp" rows="2" id="d-obs">${esc(doc?.observacao||'')}</textarea></div>`,
      rodape: `<button class="btn outline" data-fechar>Cancelar</button><button class="btn" id="d-salvar">Salvar</button>`,

        m.$('#d-arq').onchange = async e => { const f = e.target.files[0]; if (!f) return; m.$('#d-ok').textContent = 'Enviando...';

          try { if (doc) await dbq(sb.from('documentos').update(reg).eq('id', doc.id)); else await dbq(sb.from('documentos').insert(reg));
            ok(doc ? 'Documento atualizado' : 'Documento cadastrado'); m.fechar(); carregar(); } catch { erro('Erro ao salvar'); }
        };
      } });
  };
  $('#novo').onclick = () => form(null);
  $('#notif').onclick = () => {
    const alerta = docs.filter(d => ['vencido','proximo'].includes(situacaoDoc(d.data_vencimento).key));
    if (!alerta.length) return toast('Nenhum documento vencido ou próximo do vencimento.');
    const coords = profs.filter(p => p.email && (p.coordenacao && p.coordenacao !== 'NENHUMA' || /coordenador/.test(p.cargo||''))).map(p => p.email);

  };
  carregar();
}
